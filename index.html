 font-family:-apple-system,"Apple SD Gothic Neo",system-ui,sans-serif;
 display:flex;align-items:center;justify-content:center}

<body>
<p id="s">불러오는 중</p>
<script>
var CK='app-html-cache';
function boot(t){document.open();document.write(t);document.close()}
fetch('app.html?t='+Date.now(),{cache:'no-store'})
 .then(function(r){if(!r.ok)throw 0;return r.text()})
 .then(function(t){try{localStorage.setItem(CK,t)}catch(e){}boot(t)})
 .catch(function(){
   var c=null;try{c=localStorage.getItem(CK)}catch(e){}
   if(c)boot(c);else document.getElementById('s').textContent='연결이 필요해요. 인터넷을 확인하고 다시 열어주세요.';
 });
</script>
